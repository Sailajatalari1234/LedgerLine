spring.application.name=ledgerline

# Render gives the port in the PORT variable. Locally it stays 8080.
server.port=${PORT:8080}
# Render terminates HTTPS for us. This makes Spring understand it is behind that proxy.
server.forward-headers-strategy=framework

# Database connection. The password comes from the DB_PASSWORD environment variable.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ledgerline}
spring.datasource.username=${DB_USER:ledgerline_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# Flyway creates and changes the tables. Hibernate only checks that they match the Java code.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Session cookie safety.
# http-only: JavaScript cannot read the session cookie.
# same-site=lax: the browser does not send it on most cross-site requests.
# secure: only over HTTPS. It is false on your PC and set to true when deployed.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# First admin account, created only if the users table is empty.
ledgerline.bootstrap.admin-username=${ADMIN_USERNAME:admin}
ledgerline.bootstrap.admin-password=${ADMIN_PASSWORD:}