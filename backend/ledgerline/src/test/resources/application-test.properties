# Used only when the "test" profile is active (see @ActiveProfiles("test") in the tests).
# A separate database, so tests can wipe tables without touching real data.
spring.datasource.url=jdbc:postgresql://localhost:5432/ledgerline_test
spring.datasource.username=ledgerline_app
spring.datasource.password=${DB_PASSWORD}

# An empty password switches the first-admin bootstrap off during tests.
ledgerline.bootstrap.admin-password=